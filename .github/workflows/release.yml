name: release

# Quill does the version, the branch guard, the tag, the image and the release.
# Dusk ships a container and no binaries, so it names the `docker` publisher and
# not GoReleaser (ADR-0021). The chart releases from NerdsWhoFish/charts.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: What to cut
        type: choice
        default: Release
        options:
          - Release
          - Release Candidate
      bump:
        description: Which part of the version to bump
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      expected-source-sha:
        description: Exact source commit required for a Symphony deployment tag
        type: string
        default: ""
  # Cross-building on every PR is the point: a break that only shows up on
  # arm64 is invisible to `go test` on an amd64 runner, and arm64 is what the
  # image actually runs on.
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-{0}', github.ref) || 'release' }}
  # Cancel superseded PR builds; never cancel a release, which is mid-way
  # through tagging and publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: TheOutdoorProgrammer/quill@v1
        with:
          dry-run: "true"
          publish: docker

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify release source
        id: source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected-source-sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || exit 1
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            test -z "$EXPECTED_SOURCE_SHA" || test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA" || exit 1
          else
            [[ "$GITHUB_REF" =~ ^refs/tags/symphony-deploy/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || exit 1
            [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA" || exit 1
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || exit 1
          fi
          echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify browser telemetry package
        working-directory: packages/browser-telemetry
        run: npm ci && npm test && npm pack

      # One architecture, because buildx can only `--load` one and the smoke
      # test runs on an amd64 runner. It populates the cache quill's own build
      # reads, so proving the image costs a cache write rather than a build.
      - name: Build the image the smoke test runs
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dusk:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=0.0.0-smoke
            COMMIT=${{ github.sha }}

      # Ahead of quill on purpose, because everything before it cutting a tag is
      # side-effect free. This used to run against the pushed image, which meant
      # an image that could not serve setup had already burnt a version number.
      - name: Smoke test the image
        env:
          DUSK_SMOKE_PULL: "false"
        run: scripts/onboarding-smoke.sh dusk:smoke

      - uses: TheOutdoorProgrammer/quill@v1
        id: release
        with:
          bump: ${{ inputs.bump }}
          scope: ${{ inputs.scope }}
          release-branch: ${{ steps.source.outputs.ref }}
          publish: docker

      - name: Attach browser telemetry package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: gh release upload "$RELEASE_VERSION" packages/browser-telemetry/nerdswhofish-browser-telemetry-*.tgz

      - name: Publish exact-source image alias
        if: inputs.scope == 'Release'
        env:
          IMAGE_DIGEST: ${{ steps.release.outputs.image-digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --tag "ghcr.io/nerdswhofish/dusk:sha-$GITHUB_SHA" "ghcr.io/nerdswhofish/dusk@$IMAGE_DIGEST"
