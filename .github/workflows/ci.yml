name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # A skipped test reports success while testing nothing. This turns any
      # "dependency missing, skipping" into a failure so CI cannot go green
      # on a misconfigured runner.
      DUSK_TEST_NO_SKIP: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

      # Before the Go steps: a UI that does not compile should fail here rather
      # than at release time, where the image build is the first thing to try it.
      - run: make web

      - run: make nocgo
      - run: make test
