name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # A skipped test reports success while testing nothing. This turns any
      # "dependency missing, skipping" into a failure so CI cannot go green
      # on a misconfigured runner.
      DUSK_TEST_NO_SKIP: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

      - run: make nocgo
      - run: make test
